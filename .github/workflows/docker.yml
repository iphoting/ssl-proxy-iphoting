name: Docker smoke test

on:
  push:
    branches:
      - master
      - dokku
      - dokku**
  pull_request:
    branches:
      - master
      - dokku
      - dokku**

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      CAMO_KEY: test-secret-key

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t camo:smoke .

      - name: Start container
        run: |
          docker run -d \
            --name camo \
            -e CAMO_KEY="$CAMO_KEY" \
            -p 8081:8081 \
            camo:smoke
          # wait for server to be ready
          for i in $(seq 1 10); do
            curl -sf http://localhost:8081/status && break
            sleep 1
          done

      - name: GET / returns hwhat
        run: |
          BODY=$(curl -sf http://localhost:8081/)
          [ "$BODY" = "hwhat" ]

      - name: GET /status returns ok
        run: curl -sf http://localhost:8081/status | grep -q "^ok"

      - name: Invalid HMAC returns 404
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/badhmacsig/68747470733a2f2f6578616d706c652e636f6d2f696d6167652e6a7067)
          [ "$STATUS" = "404" ]

      - name: Valid HMAC-signed request proxies image
        run: |
          URL="https://octodex.github.com/images/original.png"
          DIGEST=$(printf '%s' "$URL" | openssl dgst -sha1 -hmac "$CAMO_KEY" | awk '{print $NF}')
          HEX_URL=$(printf '%s' "$URL" | xxd -p | tr -d '\n')
          curl -sf "http://localhost:8081/$DIGEST/$HEX_URL" -o /dev/null

      - name: Show container logs on failure
        if: failure()
        run: docker logs camo

      - name: Stop container
        if: always()
        run: docker rm -f camo
